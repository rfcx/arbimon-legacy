<div class="form-container">
    <div class="row">
        <div class="col-sm-12">
            <h4>
                Current plan
                <button class="btn btn-default"
                    type="button"
                    ng-click="changePlan()">
                    change
                </button>
            </h4>
            <div class="panel panel-default">
                <ul class="list-group">
                    <li class="list-group-item">Storage capacity: unlimited</li>
                    <li class="list-group-item">Processing capacity: unlimited</li>
                    <li class="list-group-item"
                        ng-show="project.plan_due"
                        ng-class="{ 'list-group-item-danger': (project.plan_due < today) }">
                        Plan due on: {{ project.plan_due | moment: 'll' }}
                        <span ng-show="project.plan_due < today">plan expired</span>
                    </li>
                </ul>
            </div>
        </div>
    </div>
    <hr>
    <div class="row">
        <div class="col-sm-12">
            <h4>Project Info</h4>
            <form role="form" ng-submit="save()">

                <project-form ng-model="project" valid="isValid"></project-form>
                <button class="btn btn-primary" type="submit">
                    <i class="fa fa-floppy-o"></i> Save
                </button>
            </form>
        </div>
    </div>
    <!--
      ⛔ "Delete project" button REMOVED 2026-09-16 with the retirement of
      POST /legacy-api/project/:projectUrl/remove (410 Gone).

      It performed the WEAKER delete: legacy-only, no membership snapshot, no
      ownership reassignment to the tombstone account, and insights was never
      told (the arbimon→bio ingest leg cannot carry it — rfcx-local §332), so the
      project stayed live on insights forever. Deleting a project is now done
      from the modern settings page, which deletes core + insights + legacy in
      one path with actor attribution.

      This page is itself unused (14 d edge measurement: zero human loads), so
      removing the button changes nothing a user can see today — it removes a
      destructive control that would now fail.
    -->
</div>
