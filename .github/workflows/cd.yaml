name: 'CD'
on:
  workflow_dispatch:
  push:
    branches:
      - master
concurrency: ${{ github.workflow }}-${{ github.ref }}
jobs:

  prepare:
    name: 'Prepare'
    uses: rfcx/cicd/.github/workflows/notify-prepare.yaml@master
    with:
      repo: arbimon-legacy
      workflow-id: cd.yaml
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

  configure:
    name: 'Configure'
    runs-on: ubuntu-latest
    needs: [prepare]
    outputs:
      namespace: ${{ steps.configuration.outputs.namespace }}
    steps:
      - name: 'Conditional environment'
        id: configuration
        run: |
          if [[ "${{ needs.prepare.outputs.branch-name }}" == "master" ]]; then
            echo "::set-output name=namespace::production"
          elif [[ "${{ needs.prepare.outputs.branch-name }}" == "staging" ]]; then
            echo "::set-output name=namespace::staging"
          else
            echo "::set-output name=namespace::testing"
          fi

  # GATE: the export/delete job stages of build/Dockerfile copy app/model/*
  # INDIVIDUALLY BY NAME while the web stage copies app/ whole, so a PR that
  # adds a model file the job path requires builds all three images GREEN and
  # then CrashLoops arbimon-export-consumer on MODULE_NOT_FOUND once CD rolls.
  # Bitten twice: #1892->#1893 (2026-09-16, ~3 min), #1939->#1940 (2026-09-22,
  # ~9 min, CrashLoop x3) -- both caught POST-roll by a hand-run soak check.
  # This job runs BEFORE deploy-rfcx-local (via `needs:`), so a gap fails the
  # run instead of reaching production. Red-tested before merge; see
  # runbooks/evidence/irr-ledger-2026-09-22-export-copy-gate.md in rfcx-local.
  check-stage-copy-closure:
    name: 'Gate: export/delete stage COPY closure'
    runs-on: ubuntu-latest
    needs: [prepare]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: 'require() closure vs Dockerfile COPY coverage'
        run: node build/check-stage-copy-closure.js

  # rfcx-local OPEN-ITEMS §391: the project-scope gate (also a required PR
  # check in pr-gate.yaml) re-runs pre-roll, so an admin-merged bypass of the
  # PR check still cannot ship an unbound /project/* id route.
  check-project-scope:
    name: 'Gate: project-scoped id routes'
    runs-on: ubuntu-latest
    needs: [prepare]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: 'guard + gate self-test'
        run: node build/check-project-scope.selftest.js
      - name: 'every /project/* id route bound to the URL project'
        run: node build/check-project-scope.js

  deploy-rfcx-local:
    name: 'Deploy: rfcx-local'
    needs: [prepare, configure, check-stage-copy-closure, check-project-scope]
    if: ${{ needs.configure.outputs.namespace == 'production' }}
    uses: rfcx/cicd/.github/workflows/rfcx-local-cd.yaml@master
    with:
      repo: arbimon-legacy
      dockerfile: build/Dockerfile
      # 2026-09-21: the IMAGE was renamed `arbimon` -> `arbimon-legacy` (stage
      # name in build/Dockerfile; image name == stage name). The DEPLOYMENT
      # names stay `arbimon` / `arbimon-ingest-consumer` — only the image
      # contract changed. runbooks/DESIGN-2026-09-21-arbimon-legacy-image-rename.md
      # in evity-squibbon/rfcx-local. Do not 'tidy' the names back into sync.
      targets: '["arbimon-legacy","arbimon-recording-delete-job","arbimon-recording-export-job"]'
      # Opt into the shared BuildKit registry cache (rfcx/cicd#10/#11). 3 serialized
      # builds on the single runner; fails safe (a missing/GC'd cache tag = a miss,
      # not a failure). Proven on rfcx/arbimon (14.6 -> 2.5 min) + 3 other repos.
      build-cache: true
      deployments: |
        [
          {"name": "arbimon-legacy",          "image": "arbimon-legacy"},
          {"name": "arbimon-export-consumer",  "image": "arbimon-recording-export-job"},
          {"name": "arbimon-export-reconciler", "image": "arbimon-recording-export-job", "kind": "cronjob"}
        ]


  notify:
    name: 'Notify'
    if: ${{ always() }}
    needs: [prepare, deploy-rfcx-local]
    uses: rfcx/cicd/.github/workflows/notify-send.yaml@master
    with:
      repo: arbimon-legacy
      branch-name: ${{ needs.prepare.outputs.branch-name }}
      workflow-id: cd.yaml
      previous-run-id: ${{ needs.prepare.outputs.previous-run-id }}
      status: ${{ needs.deploy-rfcx-local.result }}
      always: true
      notification-title: 'CD: Arbimon + Arbimon Recordings Delete Job'
      notification-footer: "Deploy (rfcx-local): ${{ needs.deploy-rfcx-local.result || 'n/a' }}"
      notification-success-statement: '{0} deployed the build!'
    secrets:
      slack-webhook: ${{ secrets.SLACK_ALERT_COREDT_WEBHOOK }}
      github-token: ${{ secrets.GITHUB_TOKEN }}
